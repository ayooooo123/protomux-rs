[package]
name = "protomux-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Protomux channel multiplexing, wire-compatible with the npm protomux module"
keywords = ["protomux", "hypercore", "holepunch", "multiplexing"]
categories = ["network-programming"]

[lib]
name = "protomux"

[features]
default = ["secret-stream"]
# FrameRead/FrameWrite for peeroxide's SecretStream halves.
secret-stream = ["dep:peeroxide-dht"]

[dependencies]
bytes = "1"
compact-encoding-rs = { path = "../compact-encoding-rs" }
peeroxide-dht = { version = "1.7.4", optional = true }
tokio = { version = "1.40", features = ["sync", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
peeroxide = "1.7.4"

# Our fork: UDX write pipelining, C-compatible pacing and SACKs, reachability check (see ../peeroxide).
[patch.crates-io]
peeroxide = { path = "../peeroxide/peeroxide" }
peeroxide-dht = { path = "../peeroxide/peeroxide-dht" }
libudx = { path = "../peeroxide/libudx" }
